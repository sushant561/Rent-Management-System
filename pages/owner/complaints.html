<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints — Rent Management System</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-header">
          <div><h2>Complaints & Messages</h2><p>Review and respond to tenant complaints</p></div>
        </div>
        <div class="filter-bar">
          <div class="form-group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
        </div>
        <div class="card">
          <div class="card-body no-padding">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr><th>Tenant</th><th>Subject</th><th>Description</th><th>Date</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="complaints-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <script src="../../js/utils.js"></script>
  <script src="../../js/data-store.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/owner-complaints.js"></script>
</body>
</html>

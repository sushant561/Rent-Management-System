<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Rent Management System</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-header">
          <div><h2>Settings</h2><p>Manage your profile and preferences</p></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h3>Owner Profile</h3></div>
            <div class="card-body">
              <form id="settings-form">
                <div class="form-group">
                  <label for="owner-name">Full Name</label>
                  <input type="text" id="owner-name" required>
                </div>
                <div class="form-group">
                  <label for="owner-email">Email</label>
                  <input type="email" id="owner-email" required>
                </div>
                <div class="form-group">
                  <label for="owner-phone">Phone</label>
                  <input type="tel" id="owner-phone" required>
                </div>
                <div class="form-group">
                  <label><input type="checkbox" id="owner-notifications"> Enable notifications</label>
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Account</h3></div>
            <div class="card-body">
              <p style="margin-bottom:1rem">Logout from the Owner portal or reset demo data.</p>
              <button type="button" class="btn btn-outline" id="logout-btn-settings">Logout</button>
              <button type="button" class="btn btn-danger" id="reset-data-btn" style="margin-left:0.5rem">Reset Demo Data</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/utils.js"></script>
  <script src="../../js/data-store.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/owner-settings.js"></script>
  <script>
    document.getElementById("logout-btn-settings").addEventListener("click", function () { RMSSession.logout(); });
  </script>
</body>
</html>

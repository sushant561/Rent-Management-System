<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Rent Management System</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <div class="page-header">
          <div><h2>Reports</h2><p>View rent and occupancy summaries</p></div>
          <div class="page-actions">
            <input type="month" id="filter-month" class="form-group" style="padding:0.5rem;border:1px solid var(--color-border);border-radius:6px">
          </div>
        </div>
        <div class="stats-grid" id="report-stats"></div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><h3>Payment Status Overview</h3></div>
            <div class="card-body"><div class="bar-chart" id="payment-chart"></div></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Monthly Payment Summary</h3></div>
            <div class="card-body no-padding">
              <div class="table-responsive">
                <table class="data-table">
                  <thead><tr><th>Tenant</th><th>Amount</th><th>Status</th><th>Paid On</th></tr></thead>
                  <tbody id="summary-table"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Property Occupancy Report</h3></div>
          <div class="card-body no-padding">
            <div class="table-responsive">
              <table class="data-table">
                <thead><tr><th>Property</th><th>Total</th><th>Occupied</th><th>Vacant</th><th>Occupancy</th><th>Income</th></tr></thead>
                <tbody id="property-report"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/utils.js"></script>
  <script src="../../js/data-store.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/owner-reports.js"></script>
</body>
</html>

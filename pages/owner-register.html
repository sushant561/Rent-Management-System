<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Owner Registration — Rent Management System">
  <title>Owner Registration — Rent Management System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page" data-auth-page="owner-register">

  <header>
    <nav class="navbar" aria-label="Auth navigation">
      <div class="container">
        <a href="../index.html" class="navbar-brand">
          <img src="../assets/rmslogo.png" class="navbar-brand-logo" alt="Rent Management System logo">
          Rent Management System
        </a>
      </div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-role-badge owner">Owner Portal</span>
        <h1>Owner Registration</h1>
        <p>Create an account to manage your rental properties</p>
      </div>

      <div id="auth-error" class="auth-error" role="alert"></div>
      <div id="auth-success" class="auth-success" role="status"></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">Create Owner Account</button>
      </form>

      <div class="auth-footer">
        <a href="owner-login.html">Already have an account? Log in</a>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/owner-register.js"></script>
</body>
</html>

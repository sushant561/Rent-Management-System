<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tenant Dashboard — Rent Management System">
  <title>Tenant Dashboard — Rent Management System</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page-content">
        <section class="dashboard-hero" id="tenant-hero"></section>
        <div class="stats-grid" id="tenant-stats"></div>
        <div class="status-layout">
          <div class="card">
            <div class="card-header"><h3>Recent Payments</h3></div>
            <div class="card-body no-padding">
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr><th>Receipt ID</th><th>Month</th><th>Amount</th><th>Date</th><th>Receipt</th></tr>
                  </thead>
                  <tbody id="tenant-payments"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="info-panel">
            <div class="info-panel-header"><h3>Current Complaint Status</h3></div>
            <div class="info-panel-body">
              <div class="stack-list" id="tenant-complaint-summary"></div>
            </div>
          </div>
        </div>
        <div class="grid-2">
          <div class="info-panel">
            <div class="info-panel-header"><h3>Rental Information</h3></div>
            <div class="info-panel-body">
              <div class="info-list" id="tenant-rental-info"></div>
            </div>
          </div>
          <div class="info-panel">
            <div class="info-panel-header"><h3>Recent Alerts</h3></div>
            <div class="info-panel-body">
              <div class="stack-list" id="tenant-alert-summary"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/utils.js"></script>
  <script src="../../js/data-store.js"></script>
  <script src="../../js/session.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/tenant-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tenant Login — Rent Management System">
  <title>Tenant Login — Rent Management System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page" data-auth-role="tenant">

  <header>
    <nav class="navbar" aria-label="Auth navigation">
      <div class="container">
        <a href="../index.html" class="navbar-brand">
          <img src="../assets/rmslogo.png" class="navbar-brand-logo" alt="Rent Management System logo">
          Rent Management System
        </a>
      </div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-role-badge tenant">Tenant Portal</span>
        <h1>Tenant Login</h1>
        <p>Sign in to manage your rent and complaints</p>
      </div>

      <div id="auth-error" class="auth-error" role="alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div class="auth-footer">
        <a href="../index.html">&larr; Back to Home</a>
      </div>
    </div>
  </main>

  <script src="../js/session.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
